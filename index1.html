}

/* Layout */
.container {
  display: flex;
  height: calc(100vh - 50px);

/* Sidebar */
.sidebar {
  width: 220px;
  background: #fff;
  border-right: 1px solid #ddd;
  padding: 10px;
}

.sidebar div {
  padding: 10px;
  border-radius: 20px;
  cursor: pointer;
}

.sidebar div:hover {

}

/* Email list */
.email-list {
  width: 350px;
  background: #fff;
  border-right: 1px solid #ddd;
  overflow-y: auto;
}

.email_item {
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.email_item:hover {
  background: #f6f8fc;
}

/* NÃO LIDO */
.email_item.unread {
  background: #e8f0fe;
  font-weight: bold;
}

/* LIDO */
.email_item.read {
  background: #fff;
  font-weight: normal;
}

.email_item strong {
  display: block;
}

.email_item span {
  font-size: 13px;
  color: #555;
}

/* Email view */
.email-view {
  flex: 1;
  padding: 20px;
  background: #fff;
}

.email-meta {
  color: #666;
  font-size: 14px;
  margin-bottom: 20px;

function renderEmails() {
  const list = document.getElementById("emailList");
  list.innerHTML = "";

  emails.forEach((email, index) => {
    const div = document.createElement("div");
    div.className = `email_item ${email.read ? "read" : "unread"}`;
    div.onclick = () => openEmail(index);

    div.innerHTML = `
      <strong>${email.fromName}</strong>
      <span>${email.subject}</span>
    `;

    list.appendChild(div);
  });
}

function openEmail(index) {
  const email = emails[index];
  email.read = true;

  document.getElementById("emailView").innerHTML = `
    <h2>${email.title}</h2>
    <div class="email-meta">De: ${email.from}</div>
    <p style="white-space: pre-line;">${email.body}</p>
  `;

  renderEmails();
}

renderEmails();
