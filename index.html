
    <!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(120deg, #0a0f1f, #1a2a4f);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", Arial, sans-serif;
  color: white;
}

/* Container central */
.login-box {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Foto do usuário */
.avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #2b3a67;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  margin-bottom: 15px;
}

/* Nome */
.username {
  font-size: 22px;
  margin-bottom: 20px;
}

/* Campo senha */
.password-box {
  display: flex;
  background: rgba(255,255,255,0.15);
  border-radius: 4px;
  overflow: hidden;
}

.password-box input {
  background: transparent;
  border: none;
  padding: 12px;
  color: white;
  font-size: 16px;
  width: 220px;
  outline: none;
}

.password-box button {
  background: rgba(255,255,255,0.25);
  border: none;
  color: white;
  padding: 0 15px;
  cursor: pointer;
}

.password-box button:hover {
  background: rgba(255,255,255,0.4);
}

/* Mensagem */
.message {
  margin-top: 15px;
  font-size: 14px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="login-box">
  <div class="avatar">👤</div>
  <div class="username">Arthur Navarro</div>

  <div class="password-box">
    <input type="password" id="password" placeholder="Senha">
    <button onclick="login()">→</button>
  </div>

  <div class="message" id="msg"></div>
</div>

<script>
function login() {
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  if (password.length === 0) {
    msg.textContent = "Digite sua senha.";
    return;
  } else if (password !== "cass15/07/2007") {
    msg.textContent = "Senha incorreta. Tente novamente.";
    return;
  }

  msg.textContent = "Entrando...";

  // Simula carregamento
  setTimeout(() => {
    window.location.href = "index2.html";
  }, 1000);
}

// Enter para confirmar
document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    login();
  }
});
</script>

</body>
</html>
